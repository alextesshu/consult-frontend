server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/javascript text/javascript;

    # Vue Router: all routes return index.html so Vue handles navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term caching for hashed assets (JS/CSS bundles)
    location ~* \.(js|css|woff2|woff|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
